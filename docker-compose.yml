services:
  cloud-router:
    build:
      context: .
      dockerfile: Dockerfile.router
    container_name: cloud-router
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    volumes:
      - ./configs/router_bgp.conf:/etc/frr/frr.conf
      - ./configs/vpn/ipsec.conf:/etc/ipsec.conf
      - ./configs/vpn/ipsec.secrets:/etc/ipsec.secrets
    networks:
      net-mgmt:
        ipv4_address: 192.168.56.10

  telco-router:
    build:
      context: .
      dockerfile: Dockerfile.router
    container_name: telco-router
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    volumes:
      - ./configs/telco_bgp.conf:/etc/frr/frr.conf
      - ./configs/vpn/ipsec.conf:/etc/ipsec.conf
      - ./configs/vpn/ipsec.secrets:/etc/ipsec.secrets
    networks:
      net-mgmt:
        ipv4_address: 192.168.56.20

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./configs/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - net-mgmt

networks:
  net-mgmt:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.56.0/24
